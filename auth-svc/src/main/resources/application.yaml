server:
  port: ${SERVER_PORT:8092}

spring:
  # local secrets live in ./application-local.yaml (git-ignored, see app.oauth.google below)
  config:
    import: optional:file:./application-local.yaml
  application:
    name: auth-svc
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  http:
    serviceclient:
      user:
        base-url: ${USER_SVC_BASE_URL:http://localhost:8090}
      keycloak:
        base-url: ${KEYCLOAK_URL:http://localhost:8081}
      google-auth:
        base-url: ${GOOGLE_AUTH_BASE_URL:https://oauth2.googleapis.com}
      google-profile:
        base-url: ${GOOGLE_PROFILE_BASE_URL:https://openidconnect.googleapis.com}
      payment:
        base-url: ${PAYMENT_SVC_BASE_URL:https://payment.example.com/v1}
      inventory:
        base-url: ${INVENTORY_SVC_BASE_URL:http://inventory-service:9090}

app:
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8092/api/v1/auth/google/callback}
      success-redirect: ${GOOGLE_SUCCESS_REDIRECT:http://localhost:5173/auth/google/success}